version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/ssh-askpass-touchid
    binary: ssh-askpass-touchid
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  header: See [CHANGELOG.md](https://github.com/yokonao/ssh-askpass-touchid/blob/{{ .Tag }}/CHANGELOG.md).
